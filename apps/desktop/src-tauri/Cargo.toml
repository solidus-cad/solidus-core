[package]
name = "cad-desktop"
version = "0.1.0"
description = "Solidus desktop application (Tauri)"
license = "AGPL-3.0-only WITH AdditionRef-Solidus-Plugin-Exception"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["sync"] }
# Official builds (feature "official"): updates and device key of the machine, from the account module
# (ext/account/desktop, private), compiled in with `--features official`.
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography"], optional = true }

[target.'cfg(not(windows))'.dependencies]
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"], optional = true }
aes-gcm = { version = "0.11", optional = true }
getrandom = { version = "0.2", optional = true }

[features]
official = ["dep:tauri-plugin-updater", "dep:sha2", "dep:base64", "dep:windows", "dep:p256", "dep:aes-gcm", "dep:getrandom"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
